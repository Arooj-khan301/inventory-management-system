{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4 border-0 shadow-sm"><h4 class="fw-bold text-primary mb-3">Add Product</h4><form method="POST"><div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div><div class="mb-3"><label class="form-label">SKU</label><input type="text" name="sku" class="form-control" required></div><div class="mb-3"><label class="form-label">Category</label><select name="category_id" class="form-select">{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" value="0" required></div><div class="mb-3"><label class="form-label">Price</label><input type="number" step="0.01" name="unit_price" class="form-control" value="100.00" required></div><div class="mb-3"><label class="form-label">Reorder Level</label><input type="number" name="reorder_level" class="form-control" value="10" required></div><button class="btn btn-warning w-100 fw-bold">Save</button></form></div></div></div>
{% endblock %}
