{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="fw-bold text-primary">Product Catalog</h3></div>
<div class="card shadow-sm border-0"><table class="table table-hover mb-0"><thead class="table-light"><tr><th>SKU</th><th>Product</th><th>Category</th><th>Qty</th><th>Price</th></tr></thead><tbody>{% for p in products %}<tr><td><code>{{ p.sku }}</code></td><td class="fw-semibold">{{ p.name }}</td><td>{{ p.category_name or 'General' }}</td><td class="fw-bold">{{ p.quantity }}</td><td>PKR {{ "{:,.2f}".format(p.unit_price) }}</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
